<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domain For Sale</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f7f6;
            color: #333;
            padding: 3rem 1rem;
        }
        .container {
            background: #fff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            max-width: 500px;
            height: fit-content;
        }
        h1 { color: #2c3e50; }
        .domain-name {
            font-size: 2em;
            color: #e67e22;
            font-weight: bold;
            margin: 20px 0;
            word-break: break-all;
        }
        .contact-info {
            margin: 20px 0;
            text-align: left;
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
        }
        .contact-info p { margin: 8px 0; }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            background-color: #27ae60;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css" integrity="sha512-XcIsjKMcuVe0Ucj/xgIXQnytNwBttJbNjltBV18IOnru2lDPe9KRRyvCXw6Y5H415vbBLRm8+q6fmLUU7DfO6Q==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

<div class="container">
    <h1>Domain is for sale</h1>
    <div class="domain-name" id="domain-display">Đang tải...</div>
    
    <div class="contact-info">
        <p><strong><i class="ri-phone-line"></i> Phone:</strong> +84 866 540 045</p>
        <p><strong><i class="ri-mail-line"></i> Email:</strong> contact@lamtoi.com</p>
        <p><strong><i class="ri-telegram-line"></i> Telegram:</strong> @lamtoicom</p>
    </div>
</div>

<script>
    // Domain label comes from the `name` query param, e.g. ?name=cauhoi.vn
    (() => {
        const domain = new URLSearchParams(window.location.search).get('name')?.replace('/', '') ?? '';
        document.getElementById('domain-display').innerText = domain || 'Thiếu tham số name';
    })();
</script>

</body>
</html>
